name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, ao meio-dia (UTC)
  workflow_dispatch:          # permite rodar manualmente para testar

jobs:
  lancar:
    runs-on: ubuntu-latest
    steps:
      - name: Lança despesa automática de 1 centavo
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/despesas" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"descricao": "Ping automático", "valor": 0.01}'