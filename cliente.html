<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha do Cliente - Controle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="cabecalho cabecalho-cliente">
            <a href="index.html" class="btn-voltar">← Voltar</a>
            <h1>Ficha do Cliente</h1>
        </header>

        <!-- Formulário unificado -->
        <form id="form-cliente">
            
            <!-- Bloco 1: Dados do Cliente -->
            <section class="card card-formulario">
                <div class="cabecalho-secao"><h2>Dados do cliente</h2></div>
                <div class="layout-cliente">
                    <div class="foto-perfil">

                        <img
                            id="foto-cliente"
                            src="img/sem-foto.png"
                            alt="Foto do Cliente"
                            title="Clique para alterar a foto"
                        >

                        <input
                            type="file"
                            id="upload-foto"
                            accept="image/*"
                            style="display:none"
                        >

                        <small>Clique na foto</small>

                    </div>
                    <div class="form-dados">
                        <div class="grupo-input"><label>Nome:</label><input type="text" id="nome" placeholder="Digite o nome completo"></div>
                        <div class="grupo-input"><label>Cidade:</label><input type="text" id="cidade" placeholder="Ex: Parnamirim"></div>
                        <div class="grupo-input"><label>Bairro:</label><input type="text" id="bairro" placeholder="Nome do bairro"></div>
                        <div class="grupo-input"><label>WhatsApp:</label><input type="tel" id="whatsapp" placeholder="(00) 00000-0000"></div>
                    </div>
                </div>
            </section>

            <!-- AQUI VOCÊ ADICIONA O BOTÃO NOVO SERVIÇO -->
            <div class="area-acoes-centro" style="text-align: center; margin: 20px 0;">
                <button
                    id="btn-atualizar-cliente"
                    type="button"
                    class="btn-verde-destaque">
                    💾 Atualizar Cadastro
                </button>
            </div>

            <!-- Bloco 2: Serviço Prestado -->
            <section class="card card-formulario">
                <div class="cabecalho-secao"><h2>Serviço</h2></div>
                <div class="form-servico">
                    <div class="grupo-input"><label>Serviço:</label><input type="text" id="servico" placeholder="Descrição do que foi feito"></div>
                    <div class="grupo-input"><label>Equipamento eletrônico:</label><input type="text" id="equipamento" placeholder="Ex: Computador, Celular..."></div>
                    <div class="grupo-input"><label>Material:</label><input type="text" id="material" placeholder="Peças ou materiais utilizados"></div>
                    
                    <div class="linha-valores">

                        <div class="grupo-input">
                            <label for="valor_bruto">Valor Bruto (R$):</label>
                            <input type="text" id="valor_bruto" placeholder="0,00">
                        </div>

                        <div class="grupo-input">
                            <label for="valor_liquido">Valor Líquido (R$):</label>
                            <input type="text" id="valor_liquido" placeholder="0,00">
                        </div>

                    </div>

                    <div class="linha-rodape-servico">
                        <div class="area-anexos">
                            <!-- O label "for" faz o clique no botão ativar o input escondido -->
                            <label class="btn-laranja" for="upload-anexo">📎 Anexo</label>
                            <input type="file" id="upload-anexo" style="display: none;" onchange="uploadArquivo(event)">
                            <span id="nome-arquivo" class="icones-anexo">Nenhum arquivo</span>
                        </div>
                        <div class="grupo-input input-data">
                            <label>Data:</label>
                            <input type="date" id="data_servico">
                        </div>
                    </div>
                </div>
            </section>

            <section class="historico-container card">
                
                <!-- Cabeçalho Clicável (O "Botão") -->
                <div class="cabecalho-historico" onclick="toggleHistorico()">
                    <h2 id="titulo-historico">Histórico de Serviços ▾</h2>
                </div>

                <!-- A Div que contém a lista e será escondida -->
                <div id="lista-historico">
                    <!-- A lista será montada aqui pelo JavaScript -->
                </div>

            </section>

            <!-- Botões Finais -->
            <div class="area-acoes-finais">
                <button type="submit" class="btn-verde">Salvar serviço</button>
                <button type="button" class="btn-vermelho">Delete</button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
